# ═══════════════════════════════════════════════════════════
# Render Blueprint — Smart AgriTech Platform
# One-click deploy: Render Dashboard → New → Blueprint → select this repo
# Docs: https://render.com/docs/blueprint-spec
#
# NOTE (free tier): the free PostgreSQL database expires 30 days after
# creation, and free web services spin down after 15 min of inactivity
# (cold start ~30-60s on the next request). Fine for a demo/student
# project; upgrade the db + api plans to "starter" for a permanent app.
# ═══════════════════════════════════════════════════════════

databases:
  - name: smart-agritech-db
    databaseName: agritech_db
    user: agritech_user
    plan: free
    region: oregon

services:
  # ── Backend API (Node/Express) ──────────────────────────
  - type: web
    name: smart-agritech-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smart-agritech-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://smart-agritech-app.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false   # set manually in Render dashboard after deploy
      - key: WEATHER_API_KEY
        sync: false   # optional — leave unset to use built-in mock data

  # ── Frontend (React/Vite static site) ───────────────────
  - type: web
    name: smart-agritech-app
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://smart-agritech-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
